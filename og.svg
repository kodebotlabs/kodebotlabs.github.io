<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="KodeBot — the robotics code platform">
  <defs>
    <linearGradient id="og" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131C2A"/>
      <stop offset="100%" stop-color="#080B10"/>
    </linearGradient>
    <pattern id="oggrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#2F81F7" stroke-width="0.5" opacity="0.10"/>
    </pattern>
    <radialGradient id="ogglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2F81F7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2F81F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og)"/>
  <rect width="1200" height="630" fill="url(#oggrid)"/>
  <ellipse cx="980" cy="140" rx="380" ry="260" fill="url(#ogglow)"/>

  <!-- mark -->
  <g transform="translate(96 96) scale(1.9)">
    <path d="M32 14v-4" stroke="#4C9AFF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="32" cy="8.5" r="3" fill="#4C9AFF"/>
    <rect x="14" y="16" width="36" height="30" rx="9" fill="none" stroke="#4C9AFF" stroke-width="2.5"/>
    <rect x="10.5" y="26" width="3" height="9" rx="1.5" fill="#2F81F7"/>
    <rect x="50.5" y="26" width="3" height="9" rx="1.5" fill="#2F81F7"/>
    <circle cx="24" cy="28.5" r="3.2" fill="#79C0FF"/>
    <circle cx="40" cy="28.5" r="3.2" fill="#79C0FF"/>
    <path d="M25 37c1.8 2.2 4 3.2 7 3.2s5.2-1 7-3.2" fill="none" stroke="#79C0FF" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <text x="250" y="215" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="82" font-weight="700" fill="#E6EDF3" letter-spacing="-1.6">Kode<tspan fill="#4C9AFF">Bot</tspan></text>

  <text x="100" y="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="46" font-weight="600" fill="#E6EDF3">Build, code and deploy robots.</text>
  <text x="100" y="466" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="30" fill="#8B949E">In the browser. Against real sensors. On real hardware.</text>

  <rect x="100" y="516" width="260" height="2" fill="#2F81F7" opacity="0.5"/>
  <text x="100" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="26" fill="#4C9AFF">kodebotlabs.github.io</text>
</svg>